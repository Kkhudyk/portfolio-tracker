<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Фінанси</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">💰</div>
      <h1>Фінанси</h1>
      <p>Введіть пароль для перегляду</p>
      <form id="login-form">
        <input id="password-input" type="password" placeholder="Пароль" autocomplete="current-password" required />
        <button type="submit">Увійти</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <div class="container">

      <div class="page-header">
        <h1 class="page-title">Фінанси</h1>
        <div class="header-right">
          <span id="last-updated" class="last-updated"></span>
          <button id="btn-refresh" class="btn-ghost" title="Оновити">↻</button>
          <button id="btn-logout" class="btn-ghost">Вийти</button>
        </div>
      </div>

      <div id="content"></div>

    </div>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
